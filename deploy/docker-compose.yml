services:
  api:
    build: ../server
    env_file: .env
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: proveedores-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
